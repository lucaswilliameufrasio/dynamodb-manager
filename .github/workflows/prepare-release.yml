name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example 1.0.1 or v1.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-prep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RAW_VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        id: version
        shell: bash
        run: |
          VERSION="${RAW_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be semantic X.Y.Z, optionally prefixed with v." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout main history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Flutter from FVM pin
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.96.0

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Install git-cliff
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: git-cliff@2.13.1

      - name: Update app version and changelog
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest = Path("pubspec.yaml")
          content = manifest.read_text()
          updated, replacements = re.subn(
              r'(?m)^version:\s*[^\s]+$',
              f'version: {os.environ["RELEASE_VERSION"]}+{os.environ["BUILD_NUMBER"]}',
              content,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Could not update the pubspec.yaml version")
          manifest.write_text(updated)
          PY
          git cliff --tag "v${RELEASE_VERSION}" -o CHANGELOG.md

      - name: Validate release candidate
        run: |
          flutter pub get
          flutter analyze
          flutter test
          cargo test --manifest-path rust/Cargo.toml

      - name: Create release pull request
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_BRANCH: release/v${{ steps.version.outputs.value }}-rc.${{ github.run_attempt }}-${{ github.run_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml pubspec.lock CHANGELOG.md
          git commit -m "chore(release): prepare for v$RELEASE_VERSION"
          git push origin HEAD:"$RELEASE_BRANCH"
          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "Release v$RELEASE_VERSION" \
            --body "Automated release preparation for v$RELEASE_VERSION. Merge this PR, then push the matching tag to publish desktop packages."
